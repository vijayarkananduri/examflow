<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#20231f" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="ExamFlow is a private semester study studio that turns your syllabus and exam dates into a focused daily plan." />
  <meta name="application-name" content="ExamFlow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ExamFlow" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <title>ExamFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="menuBtn" data-action="menu" aria-label="More options" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <h1 class="page-title" id="pageTitle">Home</h1>
  </header>

  <main id="app" class="page-content" tabindex="-1" aria-live="polite"></main>

  <aside class="rail" id="rail" data-side="right" aria-label="Quick tools"></aside>

  <nav class="dock" id="dock" aria-label="Primary navigation"></nav>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet-host" id="sheetHost" role="region" aria-label="Panel"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="tourRoot"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
